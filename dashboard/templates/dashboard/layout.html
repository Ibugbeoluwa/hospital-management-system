<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital System - Dashboard</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #1e293b;
            background: #f1f5f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .topbar {
            background: #0f766e;
            color: white;
            padding: 18px 24px;
        }

        .topbar-inner,
        main {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
        }

        .brand {
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        nav a {
            color: #ecfeff;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
        }

        nav a:hover,
        nav a:focus-visible {
            background: #115e59;
        }

        main {
            padding: 32px 0;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #64748b;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card,
        .panel {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgb(15 23 42 / 5%);
        }

        .stat-card {
            padding: 20px;
        }

        .stat-label {
            margin: 0;
            color: #64748b;
            font-size: 0.95rem;
        }

        .stat-value {
            margin: 10px 0 0;
            font-size: 2rem;
            font-weight: 700;
        }

        .panel {
            margin-top: 24px;
            padding: 20px;
        }

        .panel h2 {
            margin: 0 0 16px;
            font-size: 1.2rem;
        }

        .alert-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .alert-list li {
            padding: 12px 14px;
            border-radius: 8px;
            background: #fff7ed;
            color: #9a3412;
            margin-top: 8px;
        }

        .alert-list .healthy {
            background: #f0fdf4;
            color: #166534;
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 16px;
            }

            main {
                padding: 24px 0;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'dashboard:index' %}">Hospital System</a>
            <nav aria-label="Main navigation">
                <a href="{% url 'dashboard:index' %}">Dashboard</a>
                <a href="{% url 'patients:index' %}">Patients</a>
                <a href="{% url 'doctors:index' %}">Doctors</a>
                <a href="{% url 'appointments:index' %}">Appointments</a>
                <a href="{% url 'pharmacy:index' %}">Pharmacy</a>
            </nav>
        </div>
    </header>

    <main>
        {% block body %}{% endblock %}
    </main>
</body>
</html>

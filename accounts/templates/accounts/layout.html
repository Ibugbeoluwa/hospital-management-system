<!DOCTYPE html>
<html>
<head>
    <title>Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 rounded">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard:index' %}">🏥 HMS Portal</a>
            <div class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    <span class="navbar-text text-white me-3">
                        Logged in as: <strong>{{ user.username }}</strong> ({{ user.get_role_display }})
                    </span>
                    <a class="nav-link" href="{% url 'dashboard:index' %}">Dashboard</a>
                    <a class="nav-link" href="{% url 'patients:patient_list' %}">Patients</a>
                    <a class="nav-link" href="{% url 'doctors:index' %}">Doctors</a>
                    <a class="nav-link" href="{% url 'appointments:index' %}">Appointments</a>
                    <a class="nav-link" href="{% url 'pharmacy:index' %}">Pharmacy</a>
                    <a class="btn btn-sm btn-outline-danger ms-2" href="{% url 'accounts:logout' %}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{% url 'accounts:login' %}">Login</a>
                    <a class="btn btn-sm btn-primary ms-2" href="{% url 'accounts:register' %}">Register</a>
                {% endif %}
            </div>
        </nav>

        {% block body %}
        {% endblock %}
    </div>
</body>
</html>

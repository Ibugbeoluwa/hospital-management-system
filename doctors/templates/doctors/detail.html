{% extends 'patients/layout.html' %}

{% block body %}
    <div class="bg-white p-4 border rounded">
        <h2>Dr. {{ doctor.name }}</h2>
        <p class="text-muted">Department: <strong>{{ doctor.department }}</strong></p>
        <hr>

        <p><strong>Specialization:</strong> {{ doctor.specialization }}</p>
        <p><strong>Phone:</strong> {{ doctor.phone }}</p>
        <p><strong>Status:</strong> 
            {% if doctor.is_available %}
                <span class="badge bg-success">Available</span>
            {% else %}
                <span class="badge bg-secondary">On Leave</span>
            {% endif %}
        </p>
        
        <a href="{% url 'doctors:index' %}" class="btn btn-secondary mt-3">Back to Directory</a>
    </div>
{% endblock %}

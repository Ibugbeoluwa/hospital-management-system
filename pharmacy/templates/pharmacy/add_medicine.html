{% extends 'patients/layout.html' %}

{% block body %}
    <h2>Add Medicine to Inventory</h2>

    <form method="POST" class="bg-white p-4 border rounded" style="max-width: 600px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Medicine</button>
        <a href="{% url 'pharmacy:index' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
